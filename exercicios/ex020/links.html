<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{
            color: darkred
        }

        a:active {
            color: yellow;
        }

        a:hover{
            text-decoration: underline;
            color: black;
        }

        a::after{
            content: ' [link]';
            text-decoration: none;
            font-weight: normal;
            color: lightgray;
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/Ed1l3udo" target="_blank">Github</a></li>
        <li><a href="https://www.youtube.com/@EdileudoMaciel" target="_blank">Youtube</a></li>
    </ul>
    
</body>
</html>
